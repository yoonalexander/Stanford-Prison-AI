[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stanford-ai"
version = "0.1.0"
description = "Controlled, observable multi-agent authority experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openai>=2.0,<3", "pydantic>=2.10,<3", "PyYAML>=6,<7",
  "streamlit>=1.45,<2", "pandas>=2.2,<3", "plotly>=6,<7",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
stanford-ai = "stanford_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
