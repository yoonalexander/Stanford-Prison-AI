name: Verify MVP
on: [push, pull_request]
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: python -m pytest --basetemp outputs/pytest-ci -p no:cacheprovider
      - run: python -m stanford_ai --db outputs/ci.sqlite run --backend mock --n-agents 4 --days 2
      - run: python -m build
